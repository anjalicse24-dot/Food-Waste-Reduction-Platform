<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – FeedForward</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --green:#2d6a4f; --lime:#52b788; --yellow:#f4a261;
      --orange:#e76f51; --dark:#1a1a2e; --dark2:#12121f;
    }
    body {
      font-family:'DM Sans',sans-serif;
      background:var(--dark); color:#f0ede4;
      min-height:100vh; display:flex; flex-direction:column;
    }
    body::before {
      content:''; position:fixed; inset:0;
      background:radial-gradient(ellipse at 20% 50%, rgba(82,183,136,0.07) 0%, transparent 60%),
                 radial-gradient(ellipse at 80% 20%, rgba(244,162,97,0.07) 0%, transparent 60%);
      pointer-events:none;
    }

    nav {
      display:flex; align-items:center; justify-content:space-between;
      padding:1.2rem 5%;
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .logo { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:900; color:var(--lime); text-decoration:none; }
    .logo span { color:var(--yellow); }
    .back-link { color:#888; text-decoration:none; font-size:0.88rem; transition:color 0.3s; }
    .back-link:hover { color:var(--lime); }

    .page-wrap {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:3rem 1.5rem;
    }

    .card {
      width:100%; max-width:520px;
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.09);
      border-radius:28px; padding:2.8rem 2.5rem;
      animation:fadeUp 0.6s ease both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .card-top { text-align:center; margin-bottom:2rem; }
    .card-top .emoji { font-size:2.8rem; margin-bottom:0.6rem; }
    .card-top h1 { font-family:'Playfair Display',serif; font-size:1.9rem; font-weight:900; }
    .card-top p  { color:#888; font-size:0.88rem; margin-top:0.4rem; }

    /* Role Selector */
    .role-label { font-size:0.82rem; font-weight:600; color:#aaa; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:0.6rem; }
    .role-toggle {
      display:grid; grid-template-columns:1fr 1fr 1fr;
      gap:0.5rem; margin-bottom:1.8rem;
    }
    .role-btn {
      background:rgba(255,255,255,0.04);
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:0.8rem 0.5rem;
      cursor:pointer; text-align:center;
      transition:all 0.25s; color:#bbb; font-size:0.82rem; font-weight:500;
    }
    .role-btn .rb-icon { font-size:1.4rem; display:block; margin-bottom:0.3rem; }
    .role-btn:hover { border-color:rgba(82,183,136,0.4); color:#eee; }
    .role-btn.active-donor  { background:rgba(82,183,136,0.12); border-color:var(--lime); color:var(--lime); }
    .role-btn.active-ngo    { background:rgba(244,162,97,0.12); border-color:var(--yellow); color:var(--yellow); }
    .role-btn.active-admin  { background:rgba(231,111,81,0.12); border-color:var(--orange); color:var(--orange); }

    /* Form */
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.8rem; }
    .field { margin-bottom:1rem; }
    .field label { display:block; font-size:0.8rem; font-weight:600; color:#aaa; margin-bottom:0.4rem; letter-spacing:0.3px; }
    .field input, .field select {
      width:100%; background:rgba(255,255,255,0.05);
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:10px; padding:0.75rem 1rem;
      color:#f0ede4; font-size:0.9rem; font-family:'DM Sans',sans-serif;
      transition:border-color 0.25s, box-shadow 0.25s;
      outline:none; appearance:none;
    }
    .field input:focus, .field select:focus {
      border-color:var(--lime);
      box-shadow:0 0 0 3px rgba(82,183,136,0.12);
    }
    .field input::placeholder { color:#555; }
    .field select option { background:var(--dark2); color:#f0ede4; }

    /* Password strength */
    .pw-bar { height:3px; border-radius:2px; background:rgba(255,255,255,0.08); margin-top:0.4rem; overflow:hidden; }
    .pw-bar-fill { height:100%; width:0; border-radius:2px; transition:width 0.4s, background 0.4s; }

    /* Terms */
    .terms-row {
      display:flex; align-items:flex-start; gap:0.7rem;
      margin:1rem 0 1.4rem;
    }
    .terms-row input[type=checkbox] {
      width:16px; height:16px; margin-top:2px; accent-color:var(--lime); cursor:pointer; flex-shrink:0;
    }
    .terms-row label { font-size:0.82rem; color:#888; line-height:1.5; cursor:pointer; }
    .terms-row a { color:var(--lime); text-decoration:none; }

    /* Submit */
    .btn-submit {
      width:100%; background:linear-gradient(135deg, var(--lime), var(--green));
      color:white; border:none; border-radius:12px;
      padding:0.95rem; font-size:1rem; font-weight:600;
      cursor:pointer; transition:transform 0.2s, box-shadow 0.3s;
      font-family:'DM Sans',sans-serif;
    }
    .btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(82,183,136,0.35); }
    .btn-submit:active { transform:translateY(0); }

    .divider { display:flex; align-items:center; gap:1rem; margin:1.2rem 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.08); }
    .divider span { color:#555; font-size:0.78rem; }

    .login-link { text-align:center; font-size:0.85rem; color:#888; }
    .login-link a { color:var(--lime); text-decoration:none; font-weight:600; }

    /* Success overlay */
    .success-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(10,10,20,0.9); backdrop-filter:blur(10px);
      align-items:center; justify-content:center; z-index:200;
      flex-direction:column; text-align:center;
    }
    .success-overlay.show { display:flex; animation:fadeUp 0.5s ease; }
    .success-box { padding:3rem 2.5rem; }
    .success-box .big-emoji { font-size:4rem; margin-bottom:1rem; }
    .success-box h2 { font-family:'Playfair Display',serif; font-size:2rem; font-weight:900; margin-bottom:0.7rem; }
    .success-box p  { color:#aaa; margin-bottom:2rem; }

    @media(max-width:500px){ .form-row{grid-template-columns:1fr;} .card{padding:2rem 1.5rem;} }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="logo">Feed<span>Forward</span></a>
  <a href="index.html" class="back-link">← Back to Home</a>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="card-top">
      <div class="emoji">🌱</div>
      <h1>Create Account</h1>
      <p>Join thousands making a difference, one meal at a time.</p>
    </div>

    <!-- Role Selector -->
    <div class="role-label">I am a…</div>
    <div class="role-toggle">
      <button class="role-btn active-donor" onclick="setRole('donor', this)">
        <span class="rb-icon">🍱</span>Donor
      </button>
      <button class="role-btn" onclick="setRole('ngo', this)">
        <span class="rb-icon">🤝</span>NGO / Vol.
      </button>
      <button class="role-btn" onclick="setRole('admin', this)">
        <span class="rb-icon">🛡️</span>Admin
      </button>
    </div>

    <form id="regForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="roleField" name="role" value="donor"/>

      <div class="form-row">
        <div class="field">
          <label>First Name</label>
          <input type="text" name="fname" placeholder="Anjali" required/>
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" name="lname" placeholder="Sharma" required/>
        </div>
      </div>

      <div class="field">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required/>
      </div>

      <div class="field">
        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="+91 98765 43210" required/>
      </div>

      <!-- Donor-specific -->
      <div class="field" id="orgField">
        <label id="orgLabel">Organisation / Restaurant Name</label>
        <input type="text" name="org" id="orgInput" placeholder="e.g. Rajdhani Restaurant"/>
      </div>

      <div class="field" id="cityField">
        <label>City</label>
        <select name="city" required>
          <option value="" disabled selected>Select your city</option>
          <option>Bangalore</option>
          <option>Mumbai</option>
          <option>Delhi</option>
          <option>Chennai</option>
          <option>Hyderabad</option>
          <option>Pune</option>
          <option>Kolkata</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" name="password" id="pwInput" placeholder="Min. 8 characters" required oninput="checkPw(this.value)"/>
        <div class="pw-bar"><div class="pw-bar-fill" id="pwBar"></div></div>
      </div>

      <div class="field">
        <label>Confirm Password</label>
        <input type="password" name="confirm" id="confirmPw" placeholder="Re-enter password" required/>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms" required/>
        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">🌱 Create My Account</button>
    </form>

    <div class="divider"><span>already have an account?</span></div>
    <div class="login-link"><a href="login.html">Sign in here →</a></div>
  </div>
</div>

<!-- Success Overlay -->
<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <div class="big-emoji" id="successEmoji">🎉</div>
    <h2 id="successTitle">You're In!</h2>
    <p id="successMsg">Your account has been created. Redirecting to dashboard…</p>
    <button class="btn-submit" style="max-width:200px;margin:auto;" onclick="redirectDash()">Go to Dashboard →</button>
  </div>
</div>

<script>
  let currentRole = 'donor';

  function setRole(role, btn) {
    currentRole = role;
    document.getElementById('roleField').value = role;
    document.querySelectorAll('.role-btn').forEach(b => b.className = 'role-btn');
    btn.classList.add('active-' + role);

    const orgLabel = document.getElementById('orgLabel');
    const orgInput = document.getElementById('orgInput');
    const submitBtn = document.getElementById('submitBtn');

    if (role === 'donor') {
      orgLabel.textContent = 'Organisation / Restaurant Name';
      orgInput.placeholder = 'e.g. Rajdhani Restaurant';
      submitBtn.textContent = '🍱 Create Donor Account';
    } else if (role === 'ngo') {
      orgLabel.textContent = 'NGO / Organisation Name';
      orgInput.placeholder = 'e.g. Akshaya Patra';
      submitBtn.textContent = '🤝 Create NGO Account';
    } else {
      orgLabel.textContent = 'Admin Code';
      orgInput.placeholder = 'Enter admin access code';
      submitBtn.textContent = '🛡️ Create Admin Account';
    }
  }

  function checkPw(val) {
    const bar = document.getElementById('pwBar');
    let strength = 0;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;
    const widths  = ['0%','30%','55%','80%','100%'];
    const colors  = ['','#e76f51','#f4a261','#52b788','#2d6a4f'];
    bar.style.width      = widths[strength];
    bar.style.background = colors[strength];
  }

  function handleSubmit(e) {
    e.preventDefault();
    const pw = document.getElementById('pwInput').value;
    const cf = document.getElementById('confirmPw').value;
    if (pw !== cf) { alert('Passwords do not match!'); return; }

    const overlay = document.getElementById('successOverlay');
    const emoji   = document.getElementById('successEmoji');
    const title   = document.getElementById('successTitle');
    const msg     = document.getElementById('successMsg');

    if (currentRole === 'donor') {
      emoji.textContent = '🍱'; title.textContent = 'Welcome, Donor!';
      msg.textContent   = 'Your account is ready. Start uploading food donations!';
    } else if (currentRole === 'ngo') {
      emoji.textContent = '🤝'; title.textContent = 'Welcome, Partner!';
      msg.textContent   = 'Your NGO account is ready. Find food near you!';
    } else {
      emoji.textContent = '🛡️'; title.textContent = 'Admin Access Granted!';
      msg.textContent   = 'Redirecting to the admin panel…';
    }
    overlay.classList.add('show');
  }

  function redirectDash() {
    if (currentRole === 'donor')      window.location.href = 'donor-dashboard.html';
    else if (currentRole === 'ngo')   window.location.href = 'ngo-dashboard.html';
    else                              window.location.href = 'admin-dashboard.html';
  }
</script>
</body>
</html>
